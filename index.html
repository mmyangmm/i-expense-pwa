<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f8f83">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="i 記帳">
    <title>i 記帳</title>
    <link id="manifestLink" rel="manifest" href="./manifest.webmanifest">
    <link id="faviconLink" rel="icon" href="./assets/icon-192.png" type="image/png">
    <link id="appleTouchIcon" rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img id="brandIcon" src="./assets/icon-192.png" alt="" width="42" height="42">
          <div>
            <h1>i 記帳</h1>
            <p id="todayLabel"></p>
          </div>
        </div>
        <button class="icon-button" id="installButton" type="button" hidden aria-label="安裝">⇩</button>
      </header>

      <main>
        <section class="view active" id="homeView" aria-labelledby="homeTitle">
          <div class="month-bar">
            <button class="icon-button" data-month="-1" type="button" aria-label="上個月">‹</button>
            <div>
              <h2 id="homeTitle"></h2>
              <button class="text-button" id="goCurrentMonth" type="button" hidden>回到本月</button>
            </div>
            <button class="icon-button" data-month="1" type="button" aria-label="下個月">›</button>
          </div>

          <section class="summary-panel">
            <div class="summary-grid">
              <div>
                <span class="metric-label expense-dot">支出</span>
                <strong id="monthExpense">NT$0</strong>
              </div>
              <div>
                <span class="metric-label income-dot">收入</span>
                <strong class="income" id="monthIncome">NT$0</strong>
              </div>
              <div>
                <span class="metric-label balance-dot">結餘</span>
                <strong id="monthBalance">NT$0</strong>
              </div>
            </div>
            <div class="compare-row">
              <span>6 個月平均</span>
              <span id="averageLabel">NT$0</span>
            </div>
            <div class="meter" aria-hidden="true"><span id="averageMeter"></span></div>
          </section>

          <section class="category-strip" id="categoryStrip" aria-label="分類摘要"></section>

          <section class="list-section" aria-labelledby="recentTitle">
            <div class="section-heading">
              <h3 id="recentTitle">最近記錄</h3>
              <span id="recordCount"></span>
            </div>
            <div class="transaction-list" id="transactionList"></div>
          </section>
        </section>

        <section class="view" id="statsView" aria-labelledby="statsTitle">
          <div class="section-heading stats-heading">
            <h2 id="statsTitle">統計</h2>
            <select id="statsMode" aria-label="圖表類型">
              <option value="category">分類</option>
              <option value="daily">每日</option>
            </select>
          </div>
          <section class="summary-panel stats-panel">
            <div id="chartCanvas" class="chart-canvas"></div>
          </section>
          <section class="list-section">
            <div class="section-heading">
              <h3>明細排行</h3>
              <span id="statsCount"></span>
            </div>
            <div id="statsList" class="stats-list"></div>
          </section>
        </section>

        <section class="view" id="toolsView" aria-labelledby="toolsTitle">
          <div class="section-heading settings-title">
            <h2 id="toolsTitle">工具</h2>
          </div>
          <section class="tool-stack">
            <div class="tool-panel">
              <div class="tool-head">
                <div>
                  <h3>匯率換算</h3>
                  <p id="converterStatus">可離線使用近似匯率</p>
                </div>
                <div class="tool-actions">
                  <button id="refreshConverterRates" class="icon-chip" type="button" aria-label="更新匯率">↻</button>
                  <button id="manageCurrencies" class="icon-chip" type="button" aria-label="管理幣別">☰</button>
                </div>
              </div>
              <div id="converterList" class="converter-list"></div>
              <div id="converterPad" class="converter-pad" aria-label="換匯數字鍵盤"></div>
            </div>
          </section>
        </section>

        <section class="view" id="settingsView" aria-labelledby="settingsTitle">
          <div class="section-heading settings-title">
            <h2 id="settingsTitle">設定</h2>
          </div>
          <section class="settings-list">
            <div class="settings-row auth-row">
              <span>
                <span class="settings-title-line">雲端同步</span>
                <small id="syncStatus">尚未設定 Firebase</small>
              </span>
              <strong id="authStatus">本機</strong>
            </div>
            <div class="settings-actions">
              <button id="signInButton" class="secondary-action" type="button">Google 登入</button>
              <button id="syncNowButton" class="secondary-action" type="button" disabled>立即同步</button>
              <button id="signOutButton" class="secondary-action danger-action" type="button" hidden>登出</button>
            </div>
            <div class="settings-row appearance-row">
              <span>
                <span class="settings-title-line">背景風格</span>
                <small>套用原 App 的粉色、藍色、淺色、深色風格</small>
              </span>
              <div id="backgroundOptions" class="option-grid background-options" role="radiogroup" aria-label="背景風格"></div>
            </div>
            <div class="settings-row appearance-row">
              <span>
                <span class="settings-title-line">App 圖示</span>
                <small id="iconStatus">目前使用預設圖示</small>
              </span>
              <div id="iconOptions" class="option-grid icon-options" role="radiogroup" aria-label="App 圖示"></div>
            </div>
            <div class="settings-row reminder-row">
              <span>
                <span class="settings-title-line">每日記帳提醒</span>
                <small id="reminderStatus">提醒已關閉</small>
              </span>
              <label class="switch">
                <input id="reminderEnabled" type="checkbox">
                <span></span>
              </label>
            </div>
            <div class="settings-actions reminder-actions">
              <label class="mini-field">
                <span>提醒時間</span>
                <input id="reminderTime" type="time">
              </label>
              <button id="requestNotification" class="secondary-action" type="button">通知權限</button>
            </div>
            <div class="settings-row travel-row">
              <span>
                <span class="settings-title-line">✈️ 出國模式</span>
                <small id="travelRateStatus">以台幣記帳</small>
              </span>
              <label class="switch">
                <input id="travelEnabled" type="checkbox">
                <span></span>
              </label>
            </div>
            <div class="settings-actions travel-actions">
              <label class="mini-field">
                <span>旅遊幣別</span>
                <select id="travelCurrency"></select>
              </label>
              <button id="refreshTravelRate" class="secondary-action" type="button">重新整理匯率</button>
            </div>
            <button id="exportJson" class="settings-row" type="button">
              <span>匯出備份</span>
              <strong>JSON</strong>
            </button>
            <button id="exportCsv" class="settings-row" type="button">
              <span>匯出表格</span>
              <strong>CSV</strong>
            </button>
            <label class="settings-row file-row">
              <span>匯入備份</span>
              <strong>JSON</strong>
              <input id="importJson" type="file" accept="application/json,.json">
            </label>
            <button id="pasteJson" class="settings-row" type="button">
              <span>貼上匯入</span>
              <strong>JSON</strong>
            </button>
            <button id="clearData" class="settings-row danger-row" type="button">
              <span>清除資料</span>
              <strong>全部</strong>
            </button>
          </section>
        </section>
      </main>

      <button class="fab" id="addButton" type="button">記帳</button>

      <nav class="tabbar" aria-label="主要分頁">
        <button class="tab active" data-tab="home" type="button">⌂<span>首頁</span></button>
        <button class="tab" data-tab="stats" type="button">◔<span>統計</span></button>
        <button class="tab" data-tab="tools" type="button">◇<span>工具</span></button>
        <button class="tab" data-tab="settings" type="button">⚙<span>設定</span></button>
      </nav>
    </div>

    <dialog id="entryDialog">
      <form id="entryForm" method="dialog">
        <div class="dialog-head">
          <button class="icon-button" id="cancelEntry" value="cancel" type="button" aria-label="取消">×</button>
          <h2 id="dialogTitle">快速記帳</h2>
          <button class="save-button" id="saveEntry" value="default" type="submit">儲存</button>
        </div>

        <input type="hidden" id="entryId">

        <div class="segmented" role="radiogroup" aria-label="收支類型">
          <label>
            <input type="radio" name="entryType" value="expense" checked>
            <span>支出</span>
          </label>
          <label>
            <input type="radio" name="entryType" value="income">
            <span>收入</span>
          </label>
        </div>

        <label class="field amount-field">
          <span id="amountLabel">金額</span>
          <input id="amountInput" inputmode="decimal" autocomplete="off" placeholder="0" required>
          <small id="travelEstimate" class="field-hint" hidden></small>
        </label>

        <label class="field">
          <span>分類</span>
          <select id="categoryInput"></select>
        </label>

        <label class="field">
          <span>備註</span>
          <input id="noteInput" autocomplete="off" placeholder="午餐、捷運、薪資...">
        </label>

        <label class="field">
          <span>日期</span>
          <input id="dateInput" type="datetime-local" required>
        </label>

        <section class="quick-voice">
          <div>
            <strong>語音快速記帳</strong>
            <small id="voiceStatus">可說或貼上「午餐 120」這類文字</small>
          </div>
          <textarea id="voiceText" class="tool-textarea" rows="2" placeholder="例如：午餐 120 元、薪資 30000"></textarea>
          <div class="quick-actions">
            <button id="parseVoiceButton" class="action-pill parse-pill" type="button">解析</button>
            <button id="voiceButton" class="action-pill mic-pill" type="button">語音</button>
          </div>
        </section>

        <button class="delete-button" id="deleteEntry" type="button" hidden>刪除此筆</button>
      </form>
    </dialog>

    <dialog id="currencyDialog">
      <form method="dialog" class="currency-manager">
        <div class="dialog-head">
          <button class="icon-button" id="closeCurrencyDialog" value="cancel" type="button" aria-label="關閉">×</button>
          <h2>管理幣別</h2>
          <button class="save-button" value="default" type="submit">完成</button>
        </div>
        <section class="manager-section">
          <h3>顯示中</h3>
          <p>至少保留 2 個幣別；點選換匯列表可改基準幣別。</p>
          <div id="selectedCurrencyList" class="currency-manager-list"></div>
        </section>
        <section class="manager-section">
          <h3>新增幣別</h3>
          <div id="availableCurrencyList" class="currency-manager-list"></div>
        </section>
      </form>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">
        <div>💸</div>
        <strong>本月還沒有記錄</strong>
      </div>
    </template>

    <script src="./app.js?v=ux2" type="module"></script>
  </body>
</html>
